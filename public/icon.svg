<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Musical Staff lines subtle in background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="3">
    <line x1="60" y1="160" x2="452" y2="160" />
    <line x1="60" y1="200" x2="452" y2="200" />
    <line x1="60" y1="240" x2="452" y2="240" />
    <line x1="60" y1="280" x2="452" y2="280" />
    <line x1="60" y1="320" x2="452" y2="320" />
  </g>

  <!-- Saxophone Outline / Graphic -->
  <g filter="url(#glow)">
    <!-- Sax neck and body -->
    <path d="M 230 110 C 230 110, 275 110, 290 145 C 300 170, 275 220, 260 260 C 245 300, 240 330, 250 360 C 265 400, 310 405, 335 370 C 355 340, 355 285, 335 240 C 330 230, 345 220, 352 230 C 380 280, 380 350, 345 400 C 305 450, 230 435, 215 370 C 205 325, 215 285, 235 240 C 250 205, 260 175, 250 155 C 242 138, 225 135, 210 135 L 180 135 C 170 135, 170 115, 180 115 Z" 
          fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Sax bell flare -->
    <ellipse cx="340" cy="235" rx="36" ry="18" transform="rotate(-30 340 235)" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" />
    <ellipse cx="340" cy="235" rx="26" ry="10" transform="rotate(-30 340 235)" fill="#78350f" />
    
    <!-- Sax keys -->
    <circle cx="258" cy="205" r="9" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="248" cy="245" r="9" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="240" cy="285" r="9" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="238" cy="325" r="8" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
  </g>

  <!-- Chord symbol emblem: [Am7] or C# -->
  <g transform="translate(90, 320)">
    <rect width="115" height="54" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3" opacity="0.95" />
    <text x="57" y="36" font-family="monospace, sans-serif" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">Am7</text>
  </g>
  <g transform="translate(315, 100)">
    <rect width="90" height="46" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="3" opacity="0.95" />
    <text x="45" y="32" font-family="monospace, sans-serif" font-size="22" font-weight="bold" fill="#facc15" text-anchor="middle">E♭/B♭</text>
  </g>
</svg>
